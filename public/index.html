<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장고샘 바이브코딩 AI 선생님</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><b>👩‍🏫 장고샘 바이브코딩 AI 선생님</b><small>내 생각을 AI와 함께 진짜 작품으로!</small></div><button id="new">＋ 새 작품</button></header>
<main><aside><b>🚀 나의 프로젝트</b><div id="project">새로운 작품</div><div class="steps"><span class="on">1. 아이디어</span><span>2. 계획</span><span>3. 만들기</span><span>4. 실행</span><span>5. 수정</span><span>6. 완성!</span></div><hr><b>💡 추천 미션</b><button class="mission">🐶 강아지 게임</button><button class="mission">🧩 3문제 퀴즈</button><button class="mission">🌈 소개 페이지</button></aside>
<section class="chat"><div id="messages"></div><div class="quick"><button>🎮 게임</button><button>🌐 홈페이지</button><button>🧩 퀴즈</button></div><form id="form"><textarea id="input" placeholder="무엇을 만들고 싶은지 말해줘 😊"></textarea><button>보내기 🚀</button></form><small class="privacy">로그인 없이 사용합니다. 개인정보는 입력하지 마세요.</small></section>
<section class="preview"><div class="ph"><b>🖥️ 내가 만든 작품</b><button id="run" disabled>▶ 실행</button></div><div class="frame"><iframe id="iframe" sandbox="allow-scripts"></iframe><div id="empty">🚀<b>여기에 네 작품이 나타나요!</b><span>AI 선생님과 아이디어를 이야기해보자.</span></div></div><div class="ch"><b>💻 생성된 코드</b><button id="copy" disabled>코드 복사</button></div><pre id="code">아직 코드가 없어요.</pre></section></main><script src="/app.js"></script></body></html>
